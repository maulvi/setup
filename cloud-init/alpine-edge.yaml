#cloud-config
# Alpine Edge Cloud (Incus LXC)
# Supply this file via Incus instance config: user.user-data

# Cloud-init's SSH modules run before the final-stage packages module.
# Install the SSH server early so host-key generation and service reload work.
bootcmd:
  - [sh, -c, "printf '%s\\\\n' 'https://dl-cdn.alpinelinux.org/alpine/edge/main' 'https://dl-cdn.alpinelinux.org/alpine/edge/community' > /etc/apk/repositories"]
  - [sh, -c, "if ! command -v sshd >/dev/null 2>&1 || ! command -v ssh-keygen >/dev/null 2>&1; then apk update && apk add --no-cache openssh-server openssh-keygen openssh-server-common-openrc; fi"]

ssh_pwauth: false

package_update: true
package_upgrade: true

packages:
  # Administration
  - sudo
  - bash
  - bash-completion
  - curl
  - wget
  - git
  - vim
  - nano
  - htop
  - btop
  - tmux

  # Archive utilities
  - unzip
  - zip
  - tar
  - xz
  - zstd

  # Certificates and cryptography
  - ca-certificates
  - gnupg

  # Networking
  - bind-tools
  - iputils
  - traceroute
  - mtr
  - net-tools
  - iproute2

  # System utilities
  - lsof
  - rsync
  - jq
  - ncdu
  - tzdata

  # OpenRC and OpenSSH server
  - busybox-openrc
  - openssh-server
  - openssh-keygen
  - openssh-server-common-openrc

users:
  - name: b
    gecos: Administrator
    groups: wheel
    shell: /bin/sh
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE+4ZEOdXWpq7Z+0ujjF6ZvzOhfskiuDljkbJpjNVFeA eddsa-key-20250201"

write_files:
  - path: /etc/apk/repositories
    owner: root:root
    permissions: '0644'
    content: |
      https://dl-cdn.alpinelinux.org/alpine/edge/main
      https://dl-cdn.alpinelinux.org/alpine/edge/community

  - path: /usr/local/sbin/apk-auto-upgrade
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu
      apk update
      apk upgrade --available

  - path: /etc/crontabs/root
    owner: root:root
    permissions: '0600'
    content: |
      0 3 * * * /usr/local/sbin/apk-auto-upgrade >> /var/log/apk-auto-upgrade.log 2>&1

  - path: /etc/profile.d/locale.sh
    owner: root:root
    permissions: '0644'
    content: |
      export LANG=C.UTF-8

runcmd:
  - |
    set -eu

    # Ensure the administrator group and account exist.
    if ! grep -q '^wheel:' /etc/group; then
      addgroup -S wheel
    fi

    if ! id b >/dev/null 2>&1; then
      adduser -D -s /bin/sh -g "Administrator" b
    fi

    addgroup b wheel 2>/dev/null || true

    # Set Bash as the login shell after the package has been installed.
    awk -F: 'BEGIN { OFS=":" } $1 == "b" { $7="/bin/bash" } { print }' /etc/passwd > /etc/passwd.cloud-init
    cat /etc/passwd.cloud-init > /etc/passwd
    rm -f /etc/passwd.cloud-init

    # Ensure the SSH key is present even if the users handler did not write it.
    install -d -m 0700 -o b -g b /home/b/.ssh
    cat > /home/b/.ssh/authorized_keys <<'SSHKEY'
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE+4ZEOdXWpq7Z+0ujjF6ZvzOhfskiuDljkbJpjNVFeA eddsa-key-20250201
    SSHKEY
    chown b:b /home/b/.ssh/authorized_keys
    chmod 0600 /home/b/.ssh/authorized_keys

    # Configure passwordless sudo for b.
    mkdir -p /etc/sudoers.d
    printf '%s\\n' 'b ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-b
    chmod 0440 /etc/sudoers.d/90-cloud-init-b
    if ! grep -Eq '^[[:space:]]*#includedir[[:space:]]+/etc/sudoers.d' /etc/sudoers; then
      printf '\\n#includedir /etc/sudoers.d\\n' >> /etc/sudoers
    fi
    visudo -c

    # Hostname and timezone.
    printf '%s\\n' debian > /etc/hostname
    hostname debian
    if ! grep -Eq '^[[:space:]]*127\\.0\\.1\\.1[[:space:]]+debian([[:space:]]|$)' /etc/hosts; then
      printf '%s\\n' '127.0.1.1 debian' >> /etc/hosts
    fi
    ln -snf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
    printf '%s\\n' Asia/Jakarta > /etc/timezone

    # SSH: key authentication only; prohibit root login.
    SSHD_CONFIG=/etc/ssh/sshd_config
    TMP_CONFIG="$(mktemp)"
    {
      printf '%s\\n' \\
        'PasswordAuthentication no' \\
        'KbdInteractiveAuthentication no' \\
        'PubkeyAuthentication yes' \\
        'PermitRootLogin no'
      cat "$SSHD_CONFIG"
    } > "$TMP_CONFIG"
    cat "$TMP_CONFIG" > "$SSHD_CONFIG"
    rm -f "$TMP_CONFIG"

    # Generate host keys and validate the SSH daemon configuration.
    ssh-keygen -A
    sshd -t

    # Enable services through OpenRC.
    rc-update add sshd default
    rc-service sshd restart || rc-service sshd start

    rc-update add crond default
    rc-service crond restart || rc-service crond start
