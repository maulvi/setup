#cloud-config
# Alpine Edge Docker host (Incus LXC)
# Supply this file via Incus instance config: user.user-data
#
# Configure security.nesting=true in the Incus host profile/instance.
# This guest configuration installs a complete rootful Docker toolchain.

hostname: alpine-docker
preserve_hostname: false

package_update: true
package_upgrade: true

# Alpine's docker meta-package installs:
# - docker-engine (dockerd)
# - docker-cli
# - docker-cli-buildx (Buildx plugin)
# Compose is a separate CLI plugin; docker-openrc supplies the OpenRC service.
packages:
  - docker
  - docker-cli-compose
  - docker-openrc

write_files:
  - path: /etc/apk/repositories
    owner: root:root
    permissions: '0644'
    content: |
      https://dl-cdn.alpinelinux.org/alpine/edge/main
      https://dl-cdn.alpinelinux.org/alpine/edge/community

  # Daily APK maintenance. Runs at 03:00 UTC.
  - path: /usr/local/sbin/apk-auto-upgrade
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu
      apk update
      apk upgrade --available

  - path: /etc/crontabs/root
    owner: root:root
    permissions: '0600'
    content: |
      0 3 * * * /usr/local/sbin/apk-auto-upgrade >> /var/log/apk-auto-upgrade.log 2>&1

runcmd:
  - |
    set -eu

    # Enable Docker at boot.
    rc-update add docker default

    # Start Docker and save diagnostics if the daemon fails.
    if ! rc-service docker start > /var/log/docker-cloud-init.log 2>&1; then
      {
        printf '%s\n' 'OpenRC could not start the Docker daemon.'
        printf '%s\n' '===== Docker service status ====='
        rc-service docker status
        printf '%s\n' '===== System log ====='
        logread | tail -100
      } >> /var/log/docker-cloud-init.log 2>&1 || true
      cat /var/log/docker-cloud-init.log
      exit 1
    fi

    # Wait for the daemon API, then verify Buildx and Compose plugins.
    attempt=0
    until docker info >/dev/null 2>&1; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 60 ]; then
        {
          printf '%s\n' 'Docker daemon did not become ready within 60 seconds.'
          printf '%s\n' '===== Docker service status ====='
          rc-service docker status
          printf '%s\n' '===== System log ====='
          logread | tail -100
        } >> /var/log/docker-cloud-init.log 2>&1 || true
        cat /var/log/docker-cloud-init.log
        exit 1
      fi
      sleep 1
    done

    docker buildx version
    docker compose version

    # Enable daily package maintenance.
    rc-update add crond default
    rc-service crond start || rc-service crond restart
