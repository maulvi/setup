#cloud-config
# Alpine Edge Docker host (Incus LXC)
# Supply this file via Incus instance config: user.user-data
#
# Incus HOST profile/instance must already have security.nesting=true.
# Docker also needs cgroup v2 available inside the guest.

hostname: alpine-docker
preserve_hostname: false

package_update: true
package_upgrade: true

# Minimal Docker installation: engine, CLI, and OpenRC integration only.
# Compose, Buildx, editors, shells, and general-purpose utilities are omitted.
packages:
  - docker-engine
  - docker-cli
  - docker-openrc

write_files:
  # Alpine Edge repositories.
  - path: /etc/apk/repositories
    owner: root:root
    permissions: '0644'
    content: |
      https://dl-cdn.alpinelinux.org/alpine/edge/main
      https://dl-cdn.alpinelinux.org/alpine/edge/community

  # Incus documents this marker as helpful for Docker inside nested containers.
  - path: /.dockerenv
    owner: root:root
    permissions: '0644'
    content: ""

  # Daily APK maintenance. Runs at 03:00 UTC.
  - path: /usr/local/sbin/apk-auto-upgrade
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu
      apk update
      apk upgrade --available

  - path: /etc/crontabs/root
    owner: root:root
    permissions: '0600'
    content: |
      0 3 * * * /usr/local/sbin/apk-auto-upgrade >> /var/log/apk-auto-upgrade.log 2>&1

runcmd:
  - |
    set -eu

    # Alpine uses cgroups v2 (unified) by default; make it explicit.
    if grep -Eq '^[[:space:]]*rc_cgroup_mode=' /etc/rc.conf; then
      sed -i 's/^[[:space:]]*rc_cgroup_mode=.*/rc_cgroup_mode="unified"/' /etc/rc.conf
    else
      printf '\nrc_cgroup_mode="unified"\n' >> /etc/rc.conf
    fi

    # Mount/prepare cgroups before starting Docker.
    rc-update add cgroups boot
    if ! rc-service -d cgroups start > /var/log/cgroups-cloud-init.log 2>&1; then
      if ! awk '$2 == "/sys/fs/cgroup" && $3 == "cgroup2" { found=1 } END { exit !found }' /proc/mounts; then
        printf '%s\n' 'cgroups service failed and cgroup v2 is not mounted.' >> /var/log/cgroups-cloud-init.log
        cat /var/log/cgroups-cloud-init.log
        exit 1
      fi
    fi

    # Enable Docker at boot and start it now.
    rc-update add docker default
    if ! rc-service -d docker start > /var/log/docker-cloud-init.log 2>&1; then
      {
        printf '%s\n' 'OpenRC could not start Docker.'
        rc-service -d docker status
        logread | tail -100
      } >> /var/log/docker-cloud-init.log 2>&1 || true
      cat /var/log/docker-cloud-init.log
      exit 1
    fi

    # Wait until the Docker API is responding, not merely until OpenRC returns.
    attempt=0
    until docker info >/dev/null 2>&1; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 30 ]; then
        {
          printf '%s\n' 'Docker daemon did not become ready within 30 seconds.'
          printf '%s\n' '===== OpenRC status ====='
          rc-service -d docker status
          printf '%s\n' '===== System log ====='
          logread | tail -100
        } >> /var/log/docker-cloud-init.log 2>&1 || true
        cat /var/log/docker-cloud-init.log
        exit 1
      fi
      sleep 1
    done

    # Enable daily package maintenance.
    rc-update add crond default
    rc-service crond start || rc-service crond restart
